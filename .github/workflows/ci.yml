name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ffmpeg
        # Backend tests synthesize audio via `ffmpeg lavfi` and probe
        # durations via `ffprobe` — both shipped in the ffmpeg package.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/pip install --upgrade pip
          apps/backend/.venv/bin/pip install -e "apps/backend[dev]"

      - name: Lint
        run: apps/backend/.venv/bin/ruff check apps/backend/src apps/backend/tests

      - name: Tests
        run: apps/backend/.venv/bin/pytest apps/backend/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web
        run: npm --prefix apps/web ci

      - name: Build (also runs `tsc -b` for type-check)
        run: npm --prefix apps/web run build
